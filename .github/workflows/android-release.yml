name: Android APK (latest)

on:
push:
branches:
- main
workflow_dispatch:

permissions:
contents: write

concurrency:
group: android-release
cancel-in-progress: false

jobs:
apk:
runs-on: ubuntu-latest

env:
  API_BASE_URL: https://YOUR-BACKEND.onrender.com
  STUDENT_FRONTEND_URL: https://YOUR-STUDENT-FRONTEND-URL

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4

  - name: Verify Android project
    run: |
      echo "Checking Android project..."
      ls -la
      if [ ! -d android ]; then
        echo "ERROR: android directory not found."
        exit 1
      fi
      if [ ! -f android/gradlew ]; then
        echo "ERROR: android/gradlew not found."
        find android -maxdepth 3 -type f | head -80
        exit 1
      fi

  - name: Build Android APK
    working-directory: android
    run: |
      chmod +x ./gradlew
      ./gradlew assembleDebug \
        -PAPI_BASE_URL="$API_BASE_URL" \
        -PSTUDENT_FRONTEND_URL="$STUDENT_FRONTEND_URL"

  - name: Find and prepare APK
    run: |
      APK_PATH="$(find android -type f \
        -path '*/build/outputs/apk/*/*.apk' \
        ! -name '*androidTest*' | head -n 1)"

      if [ -z "$APK_PATH" ]; then
        echo "ERROR: APK was not generated."
        exit 1
      fi

      mkdir -p release-apk
      cp "$APK_PATH" release-apk/Student-Election-App.apk
      echo "APK prepared successfully."

  - name: Replace previous latest release
    env:
      GH_TOKEN: ${{ github.token }}
    run: |
      gh release delete latest --yes --cleanup-tag || true

  - name: Publish latest APK
    uses: softprops/action-gh-release@v2
    with:
      tag_name: latest
      name: Latest Student Election App
      body: |
        Latest automatically built Student Election Android APK.

        Download Student-Election-App.apk below.
      files: release-apk/Student-Election-App.apk
      make_latest: true
      fail_on_unmatched_files: true
