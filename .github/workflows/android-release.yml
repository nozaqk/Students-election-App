name: Android APK (latest)

on:
push:
branches:
- main
workflow_dispatch:

permissions:
contents: write

concurrency:
group: android-latest
cancel-in-progress: true

jobs:
apk:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "17"

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Install Android SDK components
    run: |
      sdkmanager --install \
        "platforms;android-34" \
        "build-tools;34.0.0" \
        "platform-tools"

  - name: Verify Android SDK
    run: |
      sdkmanager --list_installed
      echo "ANDROID_HOME=$ANDROID_HOME"

  - name: Locate Gradle wrapper
    run: |
      if [ ! -f "./gradlew" ]; then
        echo "ERROR: gradlew was not found in the repository root."
        echo "Repository files:"
        ls -la
        exit 1
      fi
      chmod +x ./gradlew

  - name: Run unit tests
    continue-on-error: true
    env:
      STUDENT_URL: ${{ vars.STUDENT_URL || 'https://student-election-frontend.edgeone.dev' }}
    run: |
      ./gradlew :app:testDebugUnitTest \
        -PstudentUrl="$STUDENT_URL" \
        --stacktrace

  - name: Build APK
    env:
      STUDENT_URL: ${{ vars.STUDENT_URL || 'https://student-election-frontend.edgeone.dev' }}
    run: |
      ./gradlew :app:assembleDebug \
        -PstudentUrl="$STUDENT_URL" \
        --stacktrace

  - name: Verify and prepare APK
    run: |
      APK_PATH="app/build/outputs/apk/debug/app-debug.apk"

      if [ ! -f "$APK_PATH" ]; then
        echo "ERROR: APK was not generated."
        find . -path "*/build/outputs/apk/*.apk" -type f
        exit 1
      fi

      cp "$APK_PATH" election-app.apk
      ls -lh election-app.apk

  - name: Replace latest release
    env:
      GH_TOKEN: ${{ github.token }}
    run: |
      gh release delete latest --cleanup-tag --yes || true

      gh release create latest election-app.apk \
        --target "$GITHUB_SHA" \
        --title "Election App - Latest Build" \
        --notes "Latest Android election app APK." \
        --latest
