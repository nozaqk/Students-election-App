name: Android APK (latest)
# Builds the Flutter app on every push to main and keeps ONE release called "latest" holding only the newest APK.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: android-latest-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash   # bash -eo pipefail: a failure before `| tee` still fails the step
jobs:
  check:
    name: Analyse and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Formatting, analysis and tests
        run: ./scripts/check.sh 2>&1 | tee check-output.txt
      - name: Report failure on the pull request
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "### ❌ Analyse and test failed"; echo; echo '```'; grep -v '^\s*$' check-output.txt | tail -n 250; echo '```'; } > comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file comment.md

  apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build APK
        env:
          API_URL: ${{ vars.API_URL || 'https://students-election-system.onrender.com' }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/build_apk.sh --release 2>&1 | tee build-output.txt
      - name: Report failure on the pull request
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "### ❌ Build APK failed"; echo; echo '```'; grep -v '^\s*$' build-output.txt | grep -iv '^\s*at \|^\s*\.\.\.' | tail -n 200; echo '```'; } > comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file comment.md
      - uses: actions/upload-artifact@v4
        with:
          name: election-app
          path: election-app.apk
      - name: Replace the "latest" release with this build
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest election-app.apk --target "$GITHUB_SHA" --latest \
            --title "Election app (latest build)" \
            --notes "Built from commit ${GITHUB_SHA::7}. Download election-app.apk and install it on an Android phone (allow installs from this source)."
