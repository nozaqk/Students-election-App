name: Android APK (latest)
# Builds the Android app on every push to main and keeps ONE release called "latest" holding only the newest APK.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-latest
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Build APK
        working-directory: android
        run: gradle :app:assembleDebug -PstudentUrl=${{ vars.STUDENT_URL || 'https://student-election-frontend.edgeone.dev/' }}
      - name: Replace the "latest" release with this build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/*.apk election-app.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest election-app.apk --target "$GITHUB_SHA" --latest \
            --title "Election app (latest build)" \
            --notes "Built from commit ${GITHUB_SHA::7}. Download election-app.apk and install it on an Android phone (allow installs from this source)."
