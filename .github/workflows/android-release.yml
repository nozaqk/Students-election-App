name: Android APK (latest)

on:
push:
branches:
- main
workflow_dispatch:

permissions:
contents: write

concurrency:
group: android-release
cancel-in-progress: true

jobs:
apk:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4

  - name: Check Android project
    run: |
      echo "Repository root:"
      ls -la
      echo "Android directory:"
      test -d android || {
        echo "ERROR: android/ directory not found at repository root."
        exit 1
      }
      test -f android/gradlew || {
        echo "ERROR: android/gradlew not found."
        find android -maxdepth 3 -type f | head -80
        exit 1
      }

  - name: Build APK
    working-directory: android
    run: |
      chmod +x ./gradlew
      ./gradlew assembleDebug

  - name: Locate APK
    id: apk
    run: |
      APK_PATH="$(find android -type f -path '*/build/outputs/apk/*/*.apk' | head -n 1)"
      if [ -z "$APK_PATH" ]; then
        echo "ERROR: No APK was generated."
        find android -type d -path '*/build/outputs/*' -print
        exit 1
      fi
      mkdir -p release-apk
      cp "$APK_PATH" release-apk/Student-Election-App.apk
      echo "apk_path=release-apk/Student-Election-App.apk" >> "$GITHUB_OUTPUT"

  - name: Delete previous latest release
    env:
      GH_TOKEN: ${{ github.token }}
    run: |
      gh release delete latest --yes --cleanup-tag || true
      git push origin :refs/tags/latest || true

  - name: Publish latest APK
    uses: softprops/action-gh-release@v2
    with:
      tag_name: latest
      name: Latest Android APK
      body: |
        Automatically built Android debug APK.
        Download Student-Election-App.apk below.
      files: release-apk/Student-Election-App.apk
      make_latest: true
      fail_on_unmatched_files: true
