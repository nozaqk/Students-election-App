name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npx prisma generate
        env: { DATABASE_URL: "postgresql://x:y@localhost/db", DIRECT_URL: "postgresql://x:y@localhost/db" }
      - run: npx tsc --noEmit
      - run: npm test
  web:
    runs-on: ubuntu-latest
    strategy: { matrix: { app: [student, admin] } }
    defaults: { run: { working-directory: "${{ matrix.app }}" } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env: { VITE_API_URL: "https://api.example.com" }
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Accept Android SDK licenses and install platform (runner image already ships the SDK)
        run: |
          SDKM="$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Unit tests and debug APK
        working-directory: android
        run: gradle :app:testDebugUnitTest :app:assembleDebug -PstudentUrl=${{ vars.STUDENT_URL || 'https://student.example.dev' }}
      - uses: actions/upload-artifact@v4
        with: { name: election-debug-apk, path: android/app/build/outputs/apk/debug/*.apk }
